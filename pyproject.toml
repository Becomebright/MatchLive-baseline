# Only here so `pip install -e .` makes `matchlive` importable from scripts/;
# dependencies are installed from requirements.txt (see README).
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matchlive"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["matchlive*"]
